name: Build focUS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/focUS-0.1.${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focUS-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish APK to the builds branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          mkdir -p /tmp/builds
          cp out/*.apk /tmp/builds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rf --cached . -q
          cp /tmp/builds/*.apk ./focUS-latest.apk
          echo "$GITHUB_SHA" > SOURCE_COMMIT
          echo "0.1.${GITHUB_RUN_NUMBER}" > VERSION
          git add -f focUS-latest.apk SOURCE_COMMIT VERSION
          git commit -q -m "APK 0.1.${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}"
          git push -f origin builds-tmp:builds

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
